name: Build Linux AppImage

on:
  # Build on releases
  release:
    types: [published]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (all, minimal, ocr, hardsubx)'
        required: false
        default: 'all'
  # Build on pushes to workflow file for testing
  push:
    paths:
      - '.github/workflows/build_appimage.yml'
      - 'linux/build_appimage.sh'

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [minimal, ocr, hardsubx]

    steps:
      - name: Check if should build this variant
        id: should_build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TYPE="${{ github.event.inputs.build_type }}"
            if [ "$INPUT_TYPE" = "all" ] || [ "$INPUT_TYPE" = "${{ matrix.build_type }}" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.should_build.outputs.should_build == 'true'
        uses: actions/checkout@v7

      - name: Install base dependencies
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            wget \
            file \
            libfuse2 \
            zlib1g-dev \
            libpng-dev \
            libjpeg-dev \
            libfreetype-dev \
            libxml2-dev \
            libcurl4-gnutls-dev \
            libssl-dev \
            clang \
            libclang-dev

      - name: Install OCR dependencies
        if: steps.should_build.outputs.should_build == 'true' && (matrix.build_type == 'ocr' || matrix.build_type == 'hardsubx')
        run: |
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            libtesseract-dev \
            libleptonica-dev \
            tesseract-ocr-eng

      # HardSubX links rsmpeg, which src/rust/Cargo.toml builds against FFmpeg 7
      # bindings. Ubuntu 22.04 ships FFmpeg 4.4, which does not export the
      # FFmpeg 5.1+/7 symbols rsmpeg references (av_channel_layout_*,
      # av_buffersink_get_ch_layout, swr_alloc_set_opts2, av_dict_iterate), so
      # the distro packages cannot satisfy it. Build FFmpeg 7 here instead and
      # let linuxdeploy bundle it, which keeps the 22.04 glibc baseline.
      - name: Cache FFmpeg 7 build (HardSubX)
        if: steps.should_build.outputs.should_build == 'true' && matrix.build_type == 'hardsubx'
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: /opt/ffmpeg7
          key: ffmpeg-n7.1-ubuntu22

      - name: Build and install FFmpeg 7 (HardSubX)
        if: steps.should_build.outputs.should_build == 'true' && matrix.build_type == 'hardsubx' && steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends nasm yasm
          git clone -b n7.1 --depth 1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure --prefix=/opt/ffmpeg7 --enable-shared --disable-static \
            --disable-programs --disable-doc
          make -j$(nproc)
          sudo make install

      - name: Install Rust toolchain
        if: steps.should_build.outputs.should_build == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache GPAC build
        if: steps.should_build.outputs.should_build == 'true'
        id: cache-gpac
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/libgpac*
          key: gpac-v2.4.0-ubuntu22-${{ matrix.build_type }}

      - name: Build and install GPAC
        if: steps.should_build.outputs.should_build == 'true' && steps.cache-gpac.outputs.cache-hit != 'true'
        run: |
          git clone -b v2.4.0 --depth 1 https://github.com/gpac/gpac
          cd gpac
          # GPAC v2.4.0 does not compile against FFmpeg 7 (AVInputFormat.priv_data_size
          # became private), and CCExtractor only uses GPAC for ISOBMFF parsing -- the
          # minimal/ocr variants already build it with FFmpeg disabled. Saying so
          # explicitly also keeps the AppImage down to a single FFmpeg ABI.
          ./configure --disable-ffmpeg
          make -j$(nproc) lib
          sudo make install-lib
          sudo ldconfig

      - name: Update library cache
        if: steps.should_build.outputs.should_build == 'true'
        run: sudo ldconfig

      # Exported after the GPAC step as well, so GPAC cannot pick FFmpeg 7 up even
      # if --disable-ffmpeg above were ever dropped.
      - name: Use vendored FFmpeg 7 (HardSubX)
        if: steps.should_build.outputs.should_build == 'true' && matrix.build_type == 'hardsubx'
        run: |
          echo "PKG_CONFIG_PATH=/opt/ffmpeg7/lib/pkgconfig" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/ffmpeg7/lib" >> $GITHUB_ENV
          sudo ldconfig /opt/ffmpeg7/lib
          PKG_CONFIG_PATH=/opt/ffmpeg7/lib/pkgconfig pkg-config --modversion libavutil libavcodec libswscale

      - name: Build AppImage
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          cd linux
          chmod +x build_appimage.sh
          BUILD_TYPE=${{ matrix.build_type }} ./build_appimage.sh

      - name: Get AppImage name
        if: steps.should_build.outputs.should_build == 'true'
        id: appimage_name
        run: |
          case "${{ matrix.build_type }}" in
            minimal)
              echo "name=ccextractor-minimal-x86_64.AppImage" >> $GITHUB_OUTPUT
              ;;
            ocr)
              echo "name=ccextractor-x86_64.AppImage" >> $GITHUB_OUTPUT
              ;;
            hardsubx)
              echo "name=ccextractor-hardsubx-x86_64.AppImage" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Test AppImage
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          chmod +x linux/${{ steps.appimage_name.outputs.name }}
          linux/${{ steps.appimage_name.outputs.name }} --version

      - name: Upload AppImage artifact
        if: steps.should_build.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.appimage_name.outputs.name }}
          path: linux/${{ steps.appimage_name.outputs.name }}

      - name: Upload to Release
        if: steps.should_build.outputs.should_build == 'true' && github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: linux/${{ steps.appimage_name.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
